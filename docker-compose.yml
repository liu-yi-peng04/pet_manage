version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ai-kb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_kb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ai-kb-milvus
    command: ["milvus", "run", "standalone"]
    # Milvus Standalone 依赖 etcd 与 minio；v2.5 镜像已内置简化启动
    environment:
      ETCD_USE_EMBED: "true"
      MINIO_USE_EMBED: "true"
      COMMON_STORAGETYPE: "local"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      MINIO_DATA_DIR: "/var/lib/milvus/minio"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus

  backend:
    build: ./backend
    container_name: ai-kb-backend
    environment:
      DATABASE_URL: mysql://root:123456@mysql:3306/ai_kb
      MILVUS_HOST: milvus
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started
    volumes:
      - uploads-data:/data/uploads

volumes:
  mysql-data:
  milvus-data:
  uploads-data: